<!doctype html>
<html lang="en-IN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1211" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="SpendWise — private, offline personal expense tracker. Your data stays on your device." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpendWise" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>SpendWise</title>
    <script>
      // Boot guard: if the app's files fail to load, show a message instead of a blank screen.
      (function () {
        var shown = false;
        function show() {
          var root = document.getElementById('root');
          var box = document.getElementById('boot-error');
          if (shown || !box || (root && root.childNodes.length)) return;
          shown = true;
          document.body.style.background = '#0f1211';
          box.hidden = false;
        }
        function fail() {
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
          else show();
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) fail();
        }, true);
        setTimeout(fail, 12000);
      })();
    </script>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('spendwise-theme') || 'dark';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>SpendWise needs JavaScript enabled.</noscript>
    <!-- Shown only if the app's files fail to load (e.g. wrong hosting setup), instead of a blank screen. -->
    <div id="boot-error" hidden style="font-family:system-ui,-apple-system,sans-serif;max-width:420px;margin:15vh auto 0;padding:0 24px;color:#ecf0ee;line-height:1.5">
      <h1 style="font-size:20px;margin:0 0 8px">SpendWise could not start</h1>
      <p style="color:#a0aba6;margin:0 0 12px">The app’s files did not load. Your saved data is not affected.</p>
      <p style="color:#a0aba6;margin:0 0 16px;font-size:14px">If you just deployed: make sure GitHub Pages uses <b>GitHub Actions</b> as its source (Settings → Pages), not “Deploy from a branch”. See Troubleshooting in the README.</p>
      <button onclick="location.reload()" style="height:44px;padding:0 20px;border:0;border-radius:12px;background:#2fd08a;color:#04140c;font-weight:600;font-size:15px">Reload</button>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
